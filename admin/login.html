<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSENTIF Admin — 로그인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { width: 100%; }
body {
  font-family: 'Inter', 'Pretendard', -apple-system, sans-serif;
  background: #F8FAFB;
  min-height: 100vh;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-font-smoothing: antialiased;
}

.login-wrap {
  width: 100%;
  max-width: 420px;
  padding: 24px;
}

.login-logo {
  text-align: center;
  margin-bottom: 36px;
}
.login-logo-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 48px; height: 48px;
  background: #0D0F12;
  border-radius: 14px;
  margin-bottom: 14px;
}
.login-logo-mark span {
  font-size: 18px; font-weight: 900;
  color: #1FDBA8; letter-spacing: -0.03em;
}
.login-logo h1 {
  font-size: 20px; font-weight: 800;
  color: #0D0F12; letter-spacing: -0.02em;
}
.login-logo p {
  font-size: 13.5px; color: #9AA5B4; margin-top: 4px;
}

.login-card {
  background: #fff;
  border: 1px solid #EAECF0;
  border-radius: 20px;
  padding: 36px 32px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.06);
}

.login-card h2 {
  font-size: 18px; font-weight: 700;
  color: #0D0F12; margin-bottom: 4px;
}
.login-card .sub {
  font-size: 13.5px; color: #9AA5B4; margin-bottom: 28px;
}

.form-group { margin-bottom: 18px; }
.form-label {
  display: block; font-size: 13px; font-weight: 600;
  color: #2D3748; margin-bottom: 6px;
}
.form-input {
  width: 100%; padding: 11px 14px;
  border: 1.5px solid #EAECF0;
  border-radius: 10px;
  font-size: 14.5px; font-family: inherit;
  color: #0D0F12; background: #fff;
  transition: border-color 0.15s, box-shadow 0.15s;
  outline: none;
}
.form-input:focus {
  border-color: #1FDBA8;
  box-shadow: 0 0 0 3px rgba(31,219,168,0.12);
}
.form-input::placeholder { color: #9AA5B4; }

.form-row-check {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 24px;
}
.check-label {
  display: flex; align-items: center; gap: 8px;
  font-size: 13.5px; color: #4A5568; cursor: pointer;
}
.check-label input[type="checkbox"] { accent-color: #1FDBA8; }
.forgot { font-size: 13px; color: #1FDBA8; font-weight: 600; cursor: pointer; }
.forgot:hover { text-decoration: underline; }

.btn-login {
  width: 100%; padding: 13px;
  background: #0D0F12; color: #fff;
  border: none; border-radius: 10px;
  font-size: 15px; font-weight: 700;
  font-family: inherit; cursor: pointer;
  transition: background 0.15s, transform 0.1s;
}
.btn-login:hover { background: #1E2433; }
.btn-login:active { transform: scale(0.99); }

.login-footer {
  text-align: center; margin-top: 20px;
  font-size: 12.5px; color: #9AA5B4;
}
.login-footer a { color: #1FDBA8; font-weight: 600; }

/* 에러 메시지 */
.form-error {
  display: none;
  font-size: 12.5px; color: #E53E3E;
  margin-top: 5px;
}
.form-input.error { border-color: #E53E3E; }
.form-input.error:focus { box-shadow: 0 0 0 3px rgba(229,62,62,0.12); }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-logo">
    <div class="login-logo-mark"><span>S</span></div>
    <h1>SSENTIF Admin</h1>
    <p>운영 백오피스에 오신 것을 환영합니다</p>
  </div>

  <div class="login-card">
    <h2>로그인</h2>
    <p class="sub">관리자 계정으로 로그인하세요</p>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="email">이메일</label>
        <input class="form-input" id="email" type="email" placeholder="admin@ssentif.com" autocomplete="email" required>
        <p class="form-error" id="emailError">유효한 이메일을 입력해주세요.</p>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">비밀번호</label>
        <input class="form-input" id="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
        <p class="form-error" id="passwordError">비밀번호를 입력해주세요.</p>
      </div>
      <div class="form-row-check">
        <label class="check-label">
          <input type="checkbox" id="remember"> 로그인 상태 유지
        </label>
        <span class="forgot">비밀번호 찾기</span>
      </div>
      <button class="btn-login" type="submit" id="loginBtn">로그인</button>
    </form>
  </div>

  <div class="login-footer">
    홈페이지로 돌아가기 → <a href="../index.html">ssentif.com</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-client.js"></script>
<script>
// 이미 로그인된 경우 대시보드로
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (session) window.location.replace('dashboard.html');
})();

async function handleLogin(e) {
  e.preventDefault();
  const emailEl    = document.getElementById('email');
  const passwordEl = document.getElementById('password');
  const btn        = document.getElementById('loginBtn');

  document.querySelectorAll('.form-error').forEach(el => el.style.display = 'none');
  document.querySelectorAll('.form-input').forEach(el => el.classList.remove('error'));

  let valid = true;
  if (!emailEl.value)    { document.getElementById('emailError').style.display = 'block';    emailEl.classList.add('error');    valid = false; }
  if (!passwordEl.value) { document.getElementById('passwordError').style.display = 'block'; passwordEl.classList.add('error'); valid = false; }
  if (!valid) return;

  btn.textContent = '로그인 중...';
  btn.disabled = true;

  const { error } = await db.auth.signInWithPassword({
    email:    emailEl.value,
    password: passwordEl.value,
  });

  if (error) {
    document.getElementById('emailError').textContent = '이메일 또는 비밀번호가 올바르지 않습니다.';
    document.getElementById('emailError').style.display = 'block';
    emailEl.classList.add('error');
    btn.textContent = '로그인';
    btn.disabled = false;
    return;
  }

  window.location.href = 'dashboard.html';
}
</script>
</body>
</html>
