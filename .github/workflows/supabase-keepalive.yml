# Supabase 무료 플랜 일시정지 방지
#
# 무료 플랜은 7일간 API 요청이 없으면 프로젝트를 자동으로 일시정지한다.
# 한번 정지되면 DNS부터 내려가서 방문자 트래픽으로는 절대 깨울 수 없고,
# 대시보드에서 수동 Restore를 해야만 풀린다.
# 그래서 매일 한 번 가벼운 요청을 보내 7일 카운터를 리셋한다.
#
# URL·anon key 는 supabase-client.js 에서 읽어온다(단일 출처 유지).
# anon key 는 원래 브라우저에 노출되는 공개 키이므로 별도 시크릿이 아니다.

name: Supabase Keepalive

on:
  schedule:
    # 매일 00:20 UTC (한국시간 09:20). 정각은 러너가 몰려 지연되므로 피함.
    - cron: '20 0 * * *'
  workflow_dispatch: # 수동 실행용

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # v4 는 Node 20 기반이라 deprecation 경고가 뜬다. v5 부터 Node 24.
      - uses: actions/checkout@v5

      - name: supabase-client.js 에서 접속 정보 추출
        id: cfg
        run: |
          URL=$(grep -o "https://[a-z0-9]*\.supabase\.co" supabase-client.js | head -1)
          KEY=$(grep -o "eyJhbGciOi[A-Za-z0-9._-]*" supabase-client.js | tail -1)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::supabase-client.js 에서 URL 또는 anon key 를 찾지 못했습니다."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "대상: $URL"

      - name: Ping
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: ${{ steps.cfg.outputs.key }}" \
            -H "Authorization: Bearer ${{ steps.cfg.outputs.key }}" \
            "${{ steps.cfg.outputs.url }}/rest/v1/articles?select=id&limit=1")

          echo "HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::Supabase 응답 $CODE — 프로젝트가 일시정지됐거나 키가 만료됐을 수 있습니다. 대시보드를 확인하세요."
            exit 1
          fi
          echo "✓ 프로젝트 정상 · 7일 카운터 리셋됨"
