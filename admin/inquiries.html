<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSENTIF Admin — 문의 내역</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: #F3F5F8; color: #111318;
  min-height: 100vh; display: flex;
  -webkit-font-smoothing: antialiased;
}

/* ── Sidebar ── */
.sidebar {
  width: 216px; flex-shrink: 0; background: #111318;
  min-height: 100vh; display: flex; flex-direction: column;
  position: fixed; top: 0; left: 0; bottom: 0; z-index: 100;
}
.sidebar-logo {
  padding: 16px 14px; border-bottom: 1px solid rgba(255,255,255,0.06);
  display: flex; align-items: center; gap: 9px;
}
.logo-mark {
  width: 26px; height: 26px; flex-shrink: 0; background: #1FDBA8; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 900; color: #0D0F12;
}
.logo-text { font-size: 13px; font-weight: 800; color: #fff; letter-spacing: -0.02em; line-height: 1.2; }
.logo-text em { color: #1FDBA8; font-style: normal; }
.logo-sub { font-size: 9px; font-weight: 700; letter-spacing: 0.1em; color: rgba(31,219,168,0.5); text-transform: uppercase; }

.sidebar-body { flex: 1; padding: 10px; display: flex; flex-direction: column; overflow-y: auto; }
.nav-group { padding-top: 14px; }
.nav-group:first-child { padding-top: 2px; }
.nav-label {
  font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  color: rgba(255,255,255,0.18); padding: 0 8px; margin-bottom: 3px;
}
.nav-item {
  display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 6px;
  font-size: 12.5px; font-weight: 500; color: rgba(255,255,255,0.4);
  cursor: pointer; transition: background 0.1s, color 0.1s;
  text-decoration: none; user-select: none; margin-bottom: 1px;
}
.nav-item:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.75); }
.nav-item.active { background: rgba(31,219,168,0.1); color: #1FDBA8; font-weight: 600; }
.nav-badge {
  margin-left: auto; background: #1FDBA8; color: #0D0F12;
  font-size: 9.5px; font-weight: 800; padding: 1px 6px; border-radius: 100px;
}
.sidebar-footer { padding: 8px 10px 10px; border-top: 1px solid rgba(255,255,255,0.06); }
.user-row {
  display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 6px;
  cursor: pointer; transition: background 0.1s;
}
.user-row:hover { background: rgba(255,255,255,0.05); }
.user-avatar {
  width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, #1FDBA8, #0CB589);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 800; color: #0D0F12;
}
.user-name { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.65); }
.user-email { font-size: 10px; color: rgba(255,255,255,0.28); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 110px; }
.logout-btn { margin-left: auto; color: rgba(255,255,255,0.2); cursor: pointer; padding: 4px; transition: color 0.1s; display: flex; }
.logout-btn:hover { color: rgba(255,255,255,0.55); }

/* ── Main ── */
.main { margin-left: 216px; flex: 1; min-height: 100vh; display: flex; flex-direction: column; }
.topbar {
  background: #fff; border-bottom: 1px solid #E5E8EC;
  padding: 0 28px; height: 52px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 50;
}
.topbar-title { font-size: 13.5px; font-weight: 700; color: #111318; letter-spacing: -0.01em; }
.topbar-right { display: flex; align-items: center; gap: 8px; }

.btn-export {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: 6px;
  border: 1px solid #E5E8EC; background: #fff;
  font-size: 12px; font-weight: 600; color: #374151;
  cursor: pointer; font-family: inherit; transition: all 0.1s; white-space: nowrap;
}
.btn-export:hover { border-color: #9CA3AF; color: #111318; }

.content { padding: 20px 28px; flex: 1; }

/* ── Toolbar ── */
.toolbar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px; gap: 10px; flex-wrap: wrap;
}
.filter-tabs { display: flex; gap: 4px; }
.filter-tab {
  padding: 5px 12px; border-radius: 100px; font-size: 12px; font-weight: 600;
  background: #fff; color: #9CA3AF; border: 1px solid #E5E8EC;
  cursor: pointer; transition: all 0.1s;
  display: flex; align-items: center; gap: 5px;
}
.filter-tab .tab-count {
  background: #F3F5F8; color: #9CA3AF;
  font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 100px;
}
.filter-tab.active { background: #111318; color: #fff; border-color: #111318; }
.filter-tab.active .tab-count { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.7); }
.filter-tab:hover:not(.active) { border-color: #9CA3AF; color: #374151; }

.search-wrap { position: relative; }
.search-wrap input {
  padding: 6px 12px 6px 32px; border: 1px solid #E5E8EC; border-radius: 7px;
  font-size: 12.5px; font-family: inherit; color: #111318; background: #fff; outline: none;
  width: 210px; transition: border-color 0.1s, box-shadow 0.1s;
}
.search-wrap input:focus { border-color: #1FDBA8; box-shadow: 0 0 0 2px rgba(31,219,168,0.1); }
.search-wrap input::placeholder { color: #9CA3AF; }
.search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #9CA3AF; pointer-events: none; }

/* ── Table ── */
.table-card { background: #fff; border: 1px solid #E5E8EC; border-radius: 10px; overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
thead th {
  padding: 9px 14px; font-size: 10.5px; font-weight: 700; color: #9CA3AF;
  text-align: left; letter-spacing: 0.06em; text-transform: uppercase;
  background: #FAFBFC; border-bottom: 1px solid #E5E8EC; white-space: nowrap;
}
thead th.sort { cursor: pointer; user-select: none; }
thead th.sort:hover { color: #374151; }
tbody tr { border-bottom: 1px solid #F0F2F5; transition: background 0.1s; cursor: pointer; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: #FAFFFE; }
tbody td { padding: 10px 14px; font-size: 12.5px; color: #374151; vertical-align: middle; }

.td-num { font-size: 11px; color: #9CA3AF; font-weight: 600; font-variant-numeric: tabular-nums; }
.td-name { font-weight: 600; color: #111318; font-size: 13px; }
.td-role { font-size: 11px; color: #9CA3AF; margin-top: 1px; }
.td-contact a { color: #374151; font-size: 12px; display: block; text-decoration: none; }
.td-contact a:hover { color: #1FDBA8; }

.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 7px; border-radius: 100px; font-size: 10.5px; font-weight: 700;
}
.badge::before { content: ''; width: 4px; height: 4px; border-radius: 50%; }
.badge.new     { background: rgba(31,219,168,0.1); color: #0A9E75; }
.badge.new::before { background: #1FDBA8; }
.badge.review  { background: rgba(245,158,11,0.1); color: #B45309; }
.badge.review::before { background: #F59E0B; }
.badge.done    { background: rgba(59,130,246,0.1); color: #1D4ED8; }
.badge.done::before { background: #3B82F6; }
.badge.hold    { background: #F3F5F8; color: #6B7280; }
.badge.hold::before { background: #9CA3AF; }


.size-tag { font-size: 11.5px; color: #9CA3AF; }

.status-select {
  padding: 3px 8px; border-radius: 6px; border: 1px solid #E5E8EC; background: #fff;
  font-size: 11.5px; font-weight: 600; color: #374151;
  cursor: pointer; font-family: inherit; outline: none; transition: border-color 0.1s;
}
.status-select:focus { border-color: #1FDBA8; }

.detail-btn {
  padding: 4px 9px; border-radius: 5px; font-size: 11px; font-weight: 600;
  border: 1px solid #E5E8EC; background: #fff; color: #6B7280;
  cursor: pointer; font-family: inherit; transition: all 0.1s;
}
.detail-btn:hover { border-color: #1FDBA8; color: #0FB68A; background: rgba(31,219,168,0.04); }

.empty-state { text-align: center; padding: 48px 20px; color: #9CA3AF; }
.empty-state .empty-icon { font-size: 28px; margin-bottom: 10px; }
.empty-state p { font-size: 13px; }

.pagination {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 18px; border-top: 1px solid #F0F2F5; font-size: 12px; color: #9CA3AF;
}
.page-btns { display: flex; gap: 3px; }
.page-btn {
  width: 28px; height: 28px; border-radius: 6px; border: 1px solid #E5E8EC; background: #fff;
  font-size: 12px; font-weight: 600; color: #374151;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.1s; font-family: inherit;
}
.page-btn:hover { border-color: #9CA3AF; }
.page-btn.active { background: #111318; color: #fff; border-color: #111318; }

/* ── Modal ── */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.4); z-index: 200;
  align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: #fff; border-radius: 14px;
  width: 540px; max-width: 100%; max-height: 90vh; overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.18);
}
.modal-header {
  padding: 18px 22px 16px; border-bottom: 1px solid #F0F2F5;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; background: #fff; z-index: 1;
}
.modal-header h3 { font-size: 15px; font-weight: 800; color: #111318; }
.modal-close {
  width: 28px; height: 28px; border-radius: 6px; border: 1px solid #E5E8EC; background: #fff;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 14px; color: #9CA3AF; transition: all 0.1s;
}
.modal-close:hover { background: #F3F5F8; color: #111318; }
.modal-body { padding: 18px 22px; }

.modal-field { margin-bottom: 14px; }
.modal-field:last-child { margin-bottom: 0; }
.modal-label {
  font-size: 10.5px; font-weight: 700; color: #9CA3AF;
  letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 4px;
}
.modal-value { font-size: 13.5px; color: #111318; font-weight: 500; line-height: 1.5; }
.modal-value.message {
  background: #F8FAFC; border: 1px solid #E5E8EC; border-radius: 8px;
  padding: 12px 14px; font-size: 13px; color: #374151; line-height: 1.7;
}
.modal-memo {
  width: 100%; box-sizing: border-box; min-height: 84px; resize: vertical;
  background: #F8FAFC; border: 1px solid #E5E8EC; border-radius: 8px;
  padding: 12px 14px; font-size: 13px; color: #111318; line-height: 1.6;
  font-family: inherit;
}
.modal-memo::placeholder { color: #9CA3AF; }
.modal-memo:focus { outline: none; border-color: #1FDBA8; background: #fff; }
/* 유입경로 배지 / 등록 체크박스 / 전환율 요약 / 추가 버튼 / 폼 입력 */
.src-badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px;
  font-weight: 600; background: #EEF2F7; color: #4B5563; white-space: nowrap; }
.conv-check { width: 17px; height: 17px; accent-color: #1FDBA8; cursor: pointer; vertical-align: middle; }
.conv-stat { font-size: 12px; color: #6B7280; font-weight: 600; }
.conv-stat b { color: #0A9E75; }
.btn-add { display: inline-flex; align-items: center; gap: 5px; height: 34px; padding: 0 14px;
  border: none; border-radius: 8px; background: #111318; color: #fff; font-size: 12.5px;
  font-weight: 600; cursor: pointer; }
.btn-add:hover { background: #000; }
.modal-conv-wrap { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px;
  color: #374151; font-weight: 600; cursor: pointer; }
.modal-input, .modal-src-select { width: 100%; box-sizing: border-box; height: 40px; padding: 0 12px;
  border: 1px solid #E5E8EC; border-radius: 8px; font-size: 13px; color: #111318;
  background: #fff; font-family: inherit; }
.modal-input:focus, .modal-src-select:focus { outline: none; border-color: #1FDBA8; }
.modal-input::placeholder { color: #9CA3AF; }
.modal-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }

.modal-footer {
  padding: 14px 22px; border-top: 1px solid #F0F2F5;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.modal-status-wrap { display: flex; align-items: center; gap: 8px; }
.modal-status-label { font-size: 12px; font-weight: 600; color: #9CA3AF; }
.modal-status-select {
  padding: 6px 10px; border-radius: 7px; border: 1px solid #E5E8EC; background: #fff;
  font-size: 12.5px; font-weight: 600; color: #374151;
  cursor: pointer; font-family: inherit; outline: none;
}
.btn-save {
  padding: 7px 18px; border-radius: 7px; border: none; background: #111318; color: #fff;
  font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; transition: background 0.1s;
}
.modal-footer-actions { display: flex; align-items: center; gap: 8px; }
.btn-delete {
  padding: 7px 14px; border-radius: 7px; border: 1px solid #F3C7C7; background: #fff;
  color: #DC2626; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit;
}
.btn-delete:hover { background: #FEF2F2; }
.btn-save:hover { background: #1E2433; }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-mark">S</div>
    <div>
      <div class="logo-text">SSEN<em>TIF</em></div>
      <div class="logo-sub">Admin</div>
    </div>
  </div>
  <div class="sidebar-body">
    <div class="nav-group">
      <div class="nav-label">메뉴</div>
      <a href="dashboard.html" class="nav-item">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1" y="7.5" width="3" height="5.5" rx="1" fill="currentColor" opacity=".55"/><rect x="5.5" y="4.5" width="3" height="8.5" rx="1" fill="currentColor"/><rect x="10" y="1" width="3" height="12" rx="1" fill="currentColor" opacity=".75"/></svg>
        대시보드
      </a>
      <a href="inquiries.html" class="nav-item active">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1.5 9.5V3a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H4L2 12" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 5.5h6M4 7.5h3.5" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/></svg>
        문의 내역
        <span class="nav-badge" id="newBadge">3</span>
      </a>
      <a href="lab.html" class="nav-item">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 2.5 11.5 5 5 11.5H2.5V9L9 2.5z" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/><path d="M7.5 4 10 6.5" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/></svg>
        운영지원실
      </a>
    </div>
    <div class="nav-group">
      <div class="nav-label">설정</div>
      <a href="settings.html" class="nav-item">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="1.8" stroke="currentColor" stroke-width="1.3"/><path d="M7 1.5v1.2M7 11.3v1.2M1.5 7h1.2M11.3 7h1.2M3.1 3.1l.85.85M10.05 10.05l.85.85M3.1 10.9l.85-.85M10.05 3.95l.85-.85" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        알림 설정
      </a>
      <a href="../index.html" class="nav-item" target="_blank">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M6 2.5H3a1 1 0 0 0-1 1v7.5a1 1 0 0 0 1 1h7.5a1 1 0 0 0 1-1V8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M8.5 2H12v3.5M12 2 6.5 7.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        홈페이지 보기
      </a>
    </div>
  </div>
  <div class="sidebar-footer">
    <div class="user-row">
      <div class="user-avatar">A</div>
      <div style="min-width:0;flex:1">
        <div class="user-name">관리자</div>
        <div class="user-email">admin@ssentif.com</div>
      </div>
      <div class="logout-btn" onclick="window.location.href='login.html'">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M5 2.5H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2M8.5 9.5l3-3-3-3M11.5 6.5H5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <span class="topbar-title">문의 내역</span>
    <div class="topbar-right" style="display:flex;gap:8px;align-items:center">
      <button class="btn-add" onclick="openAddModal()">+ 문의 추가</button>
      <button class="btn-export" onclick="exportCSV()">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1.5v7M4 6.5l2.5 2.5 2.5-2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M1.5 9.5v1.5a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V9.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        CSV 내보내기
      </button>
    </div>
  </div>

  <div class="content">
    <div class="toolbar">
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all" onclick="setFilter('all',this)">
          전체 <span class="tab-count" id="cnt-all">8</span>
        </button>
        <button class="filter-tab" data-filter="신규" onclick="setFilter('신규',this)">
          신규 <span class="tab-count" id="cnt-new">3</span>
        </button>
        <button class="filter-tab" data-filter="검토중" onclick="setFilter('검토중',this)">
          검토중 <span class="tab-count" id="cnt-review">2</span>
        </button>
        <button class="filter-tab" data-filter="완료" onclick="setFilter('완료',this)">
          완료 <span class="tab-count" id="cnt-done">2</span>
        </button>
        <button class="filter-tab" data-filter="보류" onclick="setFilter('보류',this)">
          보류 <span class="tab-count" id="cnt-hold">1</span>
        </button>
      </div>
      <div class="search-wrap">
        <span class="search-icon">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><circle cx="5.5" cy="5.5" r="4" stroke="currentColor" stroke-width="1.3"/><path d="M8.5 8.5l3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </span>
        <input type="text" id="searchInput" placeholder="이름, 센터명 검색..." oninput="renderTable()">
      </div>
    </div>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>신청자</th>
            <th>연락처</th>
            <th>센터명</th>
            <th>규모</th>
            <th>유입경로</th>
            <th class="sort" onclick="sortBy('date')">접수일 ↕</th>
            <th>상태</th>
            <th>등록</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div id="emptyState" class="empty-state" style="display:none;">
        <div class="empty-icon">📭</div>
        <p>해당 조건의 문의가 없습니다.</p>
      </div>
      <div class="pagination">
        <span id="pageInfo">총 8건</span>
        <span id="convStat" class="conv-stat" style="margin-left:14px"></span>
        <div class="page-btns">
          <button class="page-btn">‹</button>
          <button class="page-btn active">1</button>
          <button class="page-btn">›</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">문의 상세</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-row">
        <div class="modal-field">

<!-- 직접 문의 등록 모달 -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-header">
      <h3>문의 직접 등록</h3>
      <button class="modal-close" onclick="closeAddModal()">✕</button>
    </div>
    <div class="modal-body">

            <div class="modal-label">연락처 *</div>

          <div class="modal-field">

          <div class="modal-field">
            <div class="modal-label">센터명 *</div>
            <input class="modal-input" id="a-center" placeholder="센터 이름">
          </div>
          <div class="modal-field">
            <div class="modal-label">센터 규모</div>
            <select class="modal-src-select" id="a-size">
              <option value="">선택 안 함</option>
              <option>1인 (개인 또는 혼자 운영)</option>
              <option>2~5인</option>
              <option>6~10인</option>
              <option>11인 이상 · 다지점</option>

        <div class="modal-field">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-client.js"></script>
<script>
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.replace('login.html'); return; }
  await loadInquiries();
})();

let inquiries = [];
let currentFilter = 'all';
let currentSort = { key: 'date', asc: false };
let openInquiryId = null;

// DB(inquiries.status)와 동일한 한글 상태값을 프론트 전역에서 그대로 사용한다.
// (CHECK 제약: '신규','검토중','완료','보류' 만 허용)
const STATUSES = ['신규', '검토중', '완료', '보류'];
// 유입경로(채널) — 직접 등록 시 선택. 홈페이지 폼 문의는 DB 기본값 '홈페이지'.
const SOURCES = ['홈페이지', '전화', '카카오톡', '인스타그램', '지인소개', '기타'];

function getFiltered() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  return inquiries.filter(r => {
    const matchFilter = currentFilter === 'all' || r.status === currentFilter;
    const matchSearch = !q || r.name.includes(q) || r.center.toLowerCase().includes(q);
    return matchFilter && matchSearch;
  });
}

function renderTable() {
  const data = getFiltered();
  const tbody = document.getElementById('tableBody');
  const empty = document.getElementById('emptyState');

  document.getElementById('cnt-all').textContent    = inquiries.length;
  document.getElementById('cnt-new').textContent    = inquiries.filter(r=>r.status==='신규').length;
  document.getElementById('cnt-review').textContent = inquiries.filter(r=>r.status==='검토중').length;
  document.getElementById('cnt-done').textContent   = inquiries.filter(r=>r.status==='완료').length;
  document.getElementById('cnt-hold').textContent   = inquiries.filter(r=>r.status==='보류').length;
  document.getElementById('newBadge').textContent   = inquiries.filter(r=>r.status==='신규').length;
  document.getElementById('pageInfo').textContent   = `총 ${data.length}건`;

  // 전환율(문의 대비 등록) — 전체 기준
  const convCnt = inquiries.filter(r => r.converted).length;
  const rate = inquiries.length ? Math.round(convCnt / inquiries.length * 100) : 0;
  const convEl = document.getElementById('convStat');
  if (convEl) convEl.innerHTML = `문의 ${inquiries.length} · 등록 <b>${convCnt}</b> · 전환율 <b>${rate}%</b>`;

  if (!data.length) { tbody.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  tbody.innerHTML = data.map((r, i) => `
    <tr onclick="openDetail(${r.id})">
      <td class="td-num">${r.id}</td>
      <td>
        <div class="td-name">${r.name}</div>
        <div class="td-role">${r.role}</div>
      </td>
      <td class="td-contact">
        <a href="tel:${r.phone}" onclick="event.stopPropagation()">${r.phone}</a>
        <a href="mailto:${r.email}" onclick="event.stopPropagation()" style="color:#9CA3AF;font-size:11px;">${r.email}</a>
      </td>
      <td>${r.center}</td>
      <td class="size-tag">${r.size}</td>
      <td><span class="src-badge">${r.source || '홈페이지'}</span></td>
      <td style="color:#9CA3AF;font-size:11.5px;font-variant-numeric:tabular-nums">${r.date}</td>
      <td>
        <select class="status-select" onclick="event.stopPropagation()" onchange="updateStatus(${r.id}, this.value)">
          ${STATUSES.map(s =>
            `<option value="${s}" ${r.status===s?'selected':''}>${s}</option>`
          ).join('')}
        </select>
      </td>
      <td style="text-align:center" onclick="event.stopPropagation()">
        <input type="checkbox" class="conv-check" ${r.converted ? 'checked' : ''}
               title="유료 등록(전환) 여부" onchange="toggleConverted(${r.id}, this.checked)">
      </td>
      <td><button class="detail-btn" onclick="event.stopPropagation(); openDetail(${r.id})">상세</button></td>
    </tr>
  `).join('');
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderTable();
}

function sortBy(key) {
  if (currentSort.key === key) currentSort.asc = !currentSort.asc;
  else { currentSort.key = key; currentSort.asc = false; }
  inquiries.sort((a,b) => {
    const v = currentSort.asc ? 1 : -1;
    return a[key] > b[key] ? v : -v;
  });
  renderTable();
}

async function updateStatus(id, status) {
  const r = inquiries.find(r => r.id === id);
  if (!r) return;
  r.status = status;
  renderTable();
  const { error } = await db.from('inquiries').update({ status }).eq('id', id);
  if (error) console.error('상태 업데이트 실패:', error.message);
}

// 목록에서 등록(유료 전환) 여부 토글
async function toggleConverted(id, converted) {
  const r = inquiries.find(r => r.id === id);
  if (r) r.converted = converted;
  renderTable(); // 전환율 수치 즉시 갱신
  const { error } = await db.from('inquiries').update({ converted }).eq('id', id);
  if (error) {
    console.error('등록여부 업데이트 실패:', error.message);
    alert('등록여부 저장 실패\n' + error.message +
      '\n\n※ inquiries 테이블에 converted 컬럼이 있어야 합니다.');
  }
}

function openDetail(id) {
  const r = inquiries.find(r => r.id === id);
  if (!r) return;
  openInquiryId = id;
  document.getElementById('modalTitle').textContent = `문의 #${r.id} — ${r.name}`;
  document.getElementById('m-name').textContent    = r.name;
  document.getElementById('m-role').textContent    = r.role;
  document.getElementById('m-phone').textContent   = r.phone;
  document.getElementById('m-email').textContent   = r.email;
  document.getElementById('m-center').textContent  = r.center;
  document.getElementById('m-size').textContent    = r.size;
  document.getElementById('m-date').textContent    = r.date;
  document.getElementById('m-message').textContent = r.message;
  document.getElementById('m-memo').value          = r.memo || '';
  document.getElementById('m-source').textContent  = r.source || '홈페이지';
  document.getElementById('modalStatus').value     = r.status;
  document.getElementById('modalConverted').checked = !!r.converted;
  document.getElementById('detailModal').classList.add('open');
}

function closeModal() {
  document.getElementById('detailModal').classList.remove('open');
  openInquiryId = null;
}

async function deleteInquiry() {
  if (!openInquiryId) return;
  const id = openInquiryId;
  const r  = inquiries.find(x => x.id === id);
  const label = r ? `${r.name} · ${r.center}` : `#${id}`;
  if (!confirm(`이 문의를 삭제할까요?\n\n${label}\n\n삭제된 문의는 복구되지 않습니다.`)) return;
  const { error } = await db.from('inquiries').delete().eq('id', id);
  if (error) {
    console.error('삭제 실패:', error.message);
    alert('삭제에 실패했습니다.\n' + error.message +
      '\n\n※ inquiries 테이블에 삭제(delete) 권한 정책이 필요합니다.');
    return;
  }
  inquiries = inquiries.filter(x => x.id !== id);
  renderTable();
  closeModal();
}

function updateStatusFromModal() {}

async function saveStatus() {
  if (!openInquiryId) { closeModal(); return; }
  const id        = openInquiryId;
  const status    = document.getElementById('modalStatus').value;
  const memo      = document.getElementById('m-memo').value.trim();
  const converted = document.getElementById('modalConverted').checked;

  // 낙관적 반영
  const r = inquiries.find(x => x.id === id);
  if (r) { r.status = status; r.memo = memo; r.converted = converted; }
  renderTable();

  // 상태 + 메모 + 등록여부를 함께 저장
  const { error } = await db.from('inquiries').update({ status, memo, converted }).eq('id', id);
  if (error) {
    console.error('저장 실패:', error.message);
    alert('저장에 실패했습니다.\n' + error.message +
      '\n\n※ 메모 기능은 inquiries 테이블에 memo 컬럼이 있어야 동작합니다.');
    return; // 모달 유지 — 다시 시도 가능
  }
  closeModal();
}

function exportCSV() {
  const data = getFiltered();
  const headers = ['#','성함','직함','연락처','이메일','센터명','센터규모','유입경로','접수일','상태','등록여부','문의내용','관리자메모'];
  const rows = data.map(r => [
    r.id, r.name, r.role, r.phone, r.email,
    r.center, r.size, (r.source||'홈페이지'), r.date, r.status,
    (r.converted ? '등록' : '미등록'),
    `"${(r.message||'').replace(/"/g,'""')}"`,
    `"${(r.memo||'').replace(/"/g,'""')}"`
  ]);
  const csv = [headers, ...rows].map(r => r.join(',')).join('\n');
  const blob = new Blob(['﻿'+csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ssentif_inquiries_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

document.getElementById('detailModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
document.getElementById('addModal').addEventListener('click', function(e) {
  if (e.target === this) closeAddModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closeAddModal(); } });

async function loadInquiries() {
  const { data, error } = await db
    .from('inquiries')
    .select('*')
    .order('submitted_at', { ascending: false });

  if (error) { console.error('문의 로드 실패:', error.message); return; }

  inquiries = (data || []).map(r => ({
    ...r,
    center:    r.center_name,
    size:      r.center_size,
    date:      r.submitted_at?.slice(0, 10) || '',
    source:    r.source || '홈페이지',
    converted: !!r.converted,
  }));
  renderTable();
}

// ── 직접 문의 등록 ──────────────────────────────
function openAddModal() {
  const f = document.getElementById('addForm');
  if (f) f.reset();
  document.getElementById('addModal').classList.add('open');
}
function closeAddModal() {
  document.getElementById('addModal').classList.remove('open');
}
async function submitNewInquiry() {
  const val = id => document.getElementById(id).value.trim();
  const name   = val('a-name');
  const phone  = val('a-phone');
  const center = val('a-center');
  if (!name || !phone || !center) {
    alert('신청자 · 연락처 · 센터명은 필수입니다.');
    return;
  }
  const payload = {
    name,
    role:        val('a-role') || null,
    phone,
    email:       val('a-email') || null,
    center_name: center,
    center_size: val('a-size') || null,
    source:      val('a-source'),
    message:     val('a-message') || null,
    memo:        val('a-memo') || null,
    // status 는 DB 기본값 '신규', converted 는 기본 false
  };
  const btn = document.getElementById('addSubmitBtn');
  btn.disabled = true;
  const { error } = await db.from('inquiries').insert([payload]);
  btn.disabled = false;
  if (error) {
    console.error('문의 등록 실패:', error.message);
    alert('문의 등록에 실패했습니다.\n' + error.message +
      '\n\n※ inquiries 테이블에 source · converted 컬럼이 있어야 합니다.');
    return;
  }
  closeAddModal();
  await loadInquiries();
}
</script>
