/* ── 아티클 헤더 ── */
.art-hero { padding: 132px 0 0; background: var(--gray-50); border-bottom: 1px solid var(--border); }
.art-hero .container { max-width: 760px; }
.art-back {

.art-tag {

}
.art-meta .dot { color: var(--gray-300); }

/* 대표 이미지는 헤더와 본문 경계에 걸치게 — 스크롤 시작점을 잡아준다 */

.art-cover img {
  width: 100%; height: auto; display: block;
  border-radius: var(--radius-lg); border: 1px solid var(--border);
  box-shadow: var(--shadow-md); background: var(--gray-100);
}

/* ── 본문 타이포그래피 ── */
.art-body {
  max-width: 720px; margin: 0 auto; padding: 56px 20px 40px;
  font-size: 16.5px; line-height: 1.85; color: var(--gray-700);
  word-break: keep-all; overflow-wrap: anywhere;
}
.art-body > *:first-child { margin-top: 0; }
/* 제목 5단계(에디터의 제목 1~5 = 마크다운 #~#####).
   em 단위라 본문 글자 크기에 비례하고, 관리자 미리보기와 같은 비율로 보인다. */
.art-body h2 {
  font-size: 2em; font-weight: 800; color: var(--black);

}
.art-body h3 {

/* style.css 의 전역 리셋(ul{list-style:none})이 본문 글머리표까지 지운다 — 본문 안에서만 되살린다 */

/* 글쓴이 프로필 링크 — 카드의 사진·팔로우 버튼이 함께 쓴다.
   계정이 바뀌면 이 한 줄만 고치면 된다. */
const AUTHOR_URL = 'https://www.instagram.com/ssentif_founder/';

/* ── helpers ── */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return '';
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}
/* lab.html 과 같은 카테고리 키를 쓴다 — 값이 어긋나면 기본 이미지로 폴백된다 */
function fallbackImg(category) {
  const map = {
    '데이터 분석': 'https://images.unsplash.com/photo-1460925895917-afdab827c52f?w=800&auto=format&fit=crop',
    '운영 전략':   'https://images.unsplash.com/photo-1581009137042-c552e485697a?w=600&auto=format&fit=crop',
    '트레이너 팁': 'https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=600&auto=format&fit=crop',
    '식단 & 영양': 'https://images.unsplash.com/photo-1490645935967-10de6ba17061?w=600&auto=format&fit=crop',
    '업계 트렌드': 'https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?w=600&auto=format&fit=crop',
  };
  return map[category] || 'https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?w=600&auto=format&fit=crop';
}

/* 검색·카카오 공유 미리보기가 아티클별로 뜨도록 메타를 갈아끼운다 */
function applyMeta(a) {
  const title = `${a.title} — SSENTIF 운영지원실`;
  const desc  = a.summary || '피트니스 센터 운영에 도움이 되는 인사이트.';
  const img   = a.thumb_url || 'https://www.ssentif.kr/og-image.png';
  const url   = `https://www.ssentif.kr/article.html?id=${a.id}`;
  document.title = title;
  const set = (sel, attr, val) => { const el = document.querySelector(sel); if (el) el.setAttribute(attr, val); };
  set('meta[name="description"]', 'content', desc);
  set('link[rel="canonical"]', 'href', url);
  set('meta[property="og:title"]', 'content', title);
  set('meta[property="og:description"]', 'content', desc);
  set('meta[property="og:image"]', 'content', img);
  set('meta[name="twitter:title"]', 'content', title);
  set('meta[name="twitter:description"]', 'content', desc);
  set('meta[name="twitter:image"]', 'content', img);
  let ogUrl = document.querySelector('meta[property="og:url"]');
  if (!ogUrl) { ogUrl = document.createElement('meta'); ogUrl.setAttribute('property','og:url'); document.head.appendChild(ogUrl); }
  ogUrl.setAttribute('content', url);
}

function showState(html) {
  document.getElementById('articleRoot').innerHTML = `<div class="art-state">${html}</div>`;
}

function renderArticle(a, others) {
  const cover = a.thumb_url || fallbackImg(a.category);
  const dateStr = formatDate(a.published_at);

  const moreCards = others.map(o => `
    <a href="article.html?id=${o.id}" class="art-more-card">
      <div class="thumb"><img src="${esc(o.thumb_url || fallbackImg(o.category))}" alt="${esc(o.title)}" loading="lazy" onerror="this.src='${esc(fallbackImg(o.category))}'"></div>
      <div class="body">
        <div class="cat">${esc(o.category || '')}</div>
        <h4>${esc(o.title)}</h4>
      </div>
    </a>`).join('');

  document.getElementById('articleRoot').innerHTML = `
    <header class="art-hero">
      <div class="container">
        <a href="lab.html" class="art-back">← 운영지원실</a>
        ${a.category ? `<div class="art-tag">${esc(a.category)}</div>` : ''}
        <h1 class="art-title">${esc(a.title)}</h1>
        <div class="art-meta">
          ${dateStr ? `<span>${dateStr}</span><span class="dot">·</span>` : ''}
          <span>읽는 시간 ${a.read_time || 5}분</span>
        </div>
      </div>
    </header>

    <div class="art-cover">
      <img src="${esc(cover)}" alt="${esc(a.title)}" onerror="this.src='${esc(fallbackImg(a.category))}'">
    </div>

    <article class="art-body">${renderMarkdown(a.content || '')}</article>

    <div class="art-author">
      <div class="art-author-card">
        <div class="aa-head">
          <div>
            <div class="aa-name">정진훈 <span class="aa-title">AI 피트니스 워크스페이스, 센티프 대표</span></div>
            <div class="aa-role"><span class="aa-badge">S</span> 피트니스 산업의 인사이트를 정리합니다</div>
          </div>
          <a class="aa-photo" href="${AUTHOR_URL}" target="_blank" rel="noopener">
            <img src="assets/profile/jinhun.jpg" alt="정진훈 프로필 사진">
          </a>
        </div>
        <p class="aa-desc">AI로 대충 쓰지 않습니다. 직접 리서치하고, 확인하고, 정리해서 씁니다.<br>느리더라도 깊은 인사이트로 업계와 함께 고민하겠습니다.</p>
        <div class="aa-foot">
          <span class="aa-handle">@ssentif_founder</span>
          <a class="aa-follow" href="${AUTHOR_URL}" target="_blank" rel="noopener">인스타그램 팔로우</a>
        </div>
      </div>
    </div>

    <div class="art-foot">
      <div class="art-foot-line">
        <a href="lab.html" class="art-back" style="margin:0">← 운영지원실의 다른 글 보기</a>
      </div>
    </div>

    ${others.length ? `
    <section class="art-more">
      <h3>이런 글도 있어요</h3>
      <div class="art-more-grid">${moreCards}</div>
    </section>` : ''}
  `;
}

/* ── load ── */
async function loadArticle() {
  const id = new URLSearchParams(location.search).get('id');
  if (!id || !/^\d+$/.test(id)) {
    showState('<h2>주소가 올바르지 않습니다</h2><p>아티클 주소를 다시 확인해주세요.</p><a href="lab.html" class="btn btn-primary">운영지원실로 가기</a>');
    return;
  }

  const { data, error } = await db
    .from('articles')
    .select('id, title, category, summary, content, thumb_url, read_time, published_at')
    .eq('id', id)
    .eq('status', 'published')
    .maybeSingle();

  if (error) {
    showState('<h2>아티클을 불러오지 못했습니다</h2><p>잠시 후 다시 시도해주세요.</p><a href="lab.html" class="btn btn-primary">운영지원실로 가기</a>');
    return;
  }
  if (!data) {
    showState('<h2>아티클을 찾을 수 없습니다</h2><p>삭제되었거나 아직 발행되지 않은 글입니다.</p><a href="lab.html" class="btn btn-primary">운영지원실로 가기</a>');
    return;
  }

  applyMeta(data);

  /* 하단 추천 3건 — 실패해도 본문은 이미 보여줄 수 있으므로 조용히 비운다 */
  let others = [];
  try {
    const { data: rest } = await db
      .from('articles')
      .select('id, title, category, thumb_url')
      .eq('status', 'published')
      .neq('id', data.id)
      .order('published_at', { ascending: false })
      .limit(3);
    others = rest || [];
  } catch (e) { others = []; }

  renderArticle(data, others);
  window.scrollTo(0, 0);
}

loadArticle();
</script>
