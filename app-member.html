<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<title>센티프 회원앱 다운로드</title>
<meta name="description" content="센티프 회원앱을 내려받습니다. 접속하신 기기에 맞는 스토어로 이동합니다.">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="센티프 회원앱 다운로드">
<meta property="og:description" content="접속하신 기기에 맞는 스토어로 이동합니다.">
<meta property="og:image" content="https://www.ssentif.kr/og-image.png">
<meta property="og:locale" content="ko_KR">
<link rel="stylesheet" href="style.css?v=6">
<style>
.dl-wrap {
  min-height: 100vh; min-height: 100svh;
  display: flex; align-items: center; justify-content: center;
  padding: 32px 22px; background: var(--gray-50);
}
.dl-card {
  width: 100%; max-width: 380px; text-align: center;
  padding: 40px 28px 32px; border-radius: 26px;
  background: var(--white); border: 1px solid var(--border);
  box-shadow: 0 12px 40px rgba(13,15,18,0.07);
}
.dl-mark {
  width: 62px; height: 62px; margin: 0 auto 20px; border-radius: 19px;
  background: var(--black); color: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 27px; font-weight: 900; letter-spacing: -0.03em;
}
.dl-card h1 { font-size: 1.32rem; letter-spacing: -0.03em; line-height: 1.4; margin-bottom: 8px; }
.dl-card .sub { font-size: 14px; line-height: 1.7; color: var(--gray-500); word-break: keep-all; }
.dl-btns { display: grid; gap: 9px; margin-top: 26px; }
.dl-btn {
  display: flex; align-items: center; justify-content: center; gap: 9px;
  padding: 13px 16px; border-radius: 13px;
  background: var(--white); border: 1px solid var(--border);
  box-shadow: 0 1px 2px rgba(13,15,18,0.05);
  color: var(--black);
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
}
.dl-btn:hover {
  border-color: rgba(31,219,168,0.55);
  box-shadow: 0 6px 18px rgba(31,219,168,0.16);
  transform: translateY(-1px);
}
.dl-btn svg { flex-shrink: 0; }
.dl-btn b { font-size: 14px; font-weight: 800; letter-spacing: -0.02em; }
.dl-note { margin-top: 18px; font-size: 12.5px; line-height: 1.7; color: var(--gray-400); word-break: keep-all; }
.dl-note a { color: var(--accent-dark); font-weight: 700; text-decoration: underline; text-underline-offset: 2px; }
</style>
</head>
<body>

<div class="dl-wrap">
  <div class="dl-card">
    <div class="dl-mark">S</div>
    <h1>센티프 회원앱</h1>
    <p class="sub">접속하신 기기에 맞는 스토어로 이동합니다.<br>자동으로 열리지 않으면 아래에서 선택해 주세요.</p>

    <div class="dl-btns">
      <a class="dl-btn" id="dlIos" href="https://apps.apple.com/kr/app/%EC%84%BC%ED%8B%B0%ED%94%84-%ED%9A%8C%EC%9B%90%EC%9A%A9-%EC%8B%A0%EB%B2%84%EC%A0%84/id6793100631">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.05 12.54c-.03-2.6 2.13-3.85 2.23-3.91-1.22-1.78-3.11-2.03-3.78-2.05-1.61-.16-3.14.94-3.96.94-.82 0-2.07-.92-3.41-.9-1.75.03-3.37 1.02-4.27 2.59-1.82 3.16-.46 7.84 1.31 10.4.86 1.26 1.89 2.66 3.24 2.61 1.3-.05 1.79-.84 3.36-.84 1.57 0 2.01.84 3.38.81 1.4-.02 2.28-1.27 3.13-2.53.99-1.45 1.4-2.86 1.42-2.93-.03-.01-2.72-1.04-2.75-4.13zM14.7 4.9c.72-.87 1.2-2.08 1.07-3.29-1.03.04-2.28.69-3.02 1.56-.66.77-1.24 2-1.09 3.18 1.15.09 2.32-.58 3.04-1.45z"/></svg>
        <b>App Store</b>
      </a>
      <a class="dl-btn" id="dlAos" href="https://play.google.com/store/apps/details?id=com.nvng.ssentif_members">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#00D7FE" d="M3.7 1.9c-.3.3-.5.8-.5 1.4v17.4c0 .6.2 1.1.5 1.4l.1.1 9.7-9.7v-.2L3.8 1.8z"/><path fill="#FFCE00" d="M16.8 15.7l-3.3-3.2v-.2l3.3-3.3 3.9 2.2c1.1.6 1.1 1.7 0 2.3z"/><path fill="#FF3A44" d="M16.8 15.7L13.5 12.4 3.7 22.1c.4.4 1 .5 1.7.1z"/><path fill="#48FF48" d="M16.8 9L5.4 2.5c-.7-.4-1.3-.4-1.7 0l9.8 9.9z"/></svg>
        <b>Google Play</b>
      </a>
    </div>

    <p class="dl-note">회원앱은 스마트폰에서만 이용하실 수 있습니다.<br>강사 · 관리자용 앱은 <a href="app">여기</a>에서 받으실 수 있습니다.</p>
  </div>
</div>

<script>
/* 기기에 맞는 스토어로 자동 이동. PC 는 그대로 두고 두 버튼을 보여준다. */
(function () {
  var ua = navigator.userAgent || '';
  // iPadOS 는 Macintosh 로 보고하므로 터치 지원 여부로 가려낸다
  var isIOS = /iPad|iPhone|iPod/.test(ua) ||
              (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/.test(ua);
  var el = isIOS ? document.getElementById('dlIos')
                 : (isAndroid ? document.getElementById('dlAos') : null);
  if (el) location.replace(el.href);
})();
</script>

</body>
</html>
