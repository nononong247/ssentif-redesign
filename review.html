<style>
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
/* Layout: 폰 한 손 기준 단일 열. 위에서 아래로 앱 → 키워드 → 길이 → 생성 → 스토어 순서대로 내려가며 끝난다. */
:root {
  --bg: #F4F5F6;
  --surface: #FFFFFF;
  --ink: #1B1D20;
  --muted: #6E737B;
  --line: #E3E5E8;
  --accent: #1FDBA8;
  --accent-ink: #0A7D5F;
  --accent-weak: #E6FBF5;
  --danger: #D9485F;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111214; --surface: #1B1C1F; --ink: #F1F2F4; --muted: #9A9FA7; --line: #2C2E33;
    --accent: #1FDBA8; --accent-ink: #4FE6BD; --accent-weak: #10352B; --danger: #FF7A8C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111214; --surface: #1B1C1F; --ink: #F1F2F4; --muted: #9A9FA7; --line: #2C2E33;
  --accent: #1FDBA8; --accent-ink: #4FE6BD; --accent-weak: #10352B; --danger: #FF7A8C;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font);
  font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased;
}
.wrap {
  max-width: 520px; margin: 0 auto;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 28px;
}
header { display: flex; flex-direction: column; gap: 10px; }
.logo { height: 22px; width: auto; align-self: flex-start; }
.logo-white { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo-dark { display: none; } :root:not([data-theme="light"]) .logo-white { display: block; } }
:root[data-theme="dark"] .logo-dark { display: none; }
:root[data-theme="dark"] .logo-white { display: block; }
h1 { margin: 6px 0 0; font-size: 24px; line-height: 1.35; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); font-size: 14.5px; }

section { display: flex; flex-direction: column; gap: 12px; }
.step-head { display: flex; align-items: baseline; gap: 8px; }
.step-no { font-size: 12px; font-weight: 700; color: var(--accent-ink); letter-spacing: 0.04em; }
h2 { margin: 0; font-size: 16px; font-weight: 600; }
.hint { margin: 0; font-size: 13px; color: var(--muted); }

/* 앱 선택 */
.apps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.app-opt { position: relative; }
.app-opt input { position: absolute; opacity: 0; inset: 0; margin: 0; }
.app-opt label {
  display: flex; flex-direction: column; gap: 2px; height: 100%;
  padding: 14px 14px 13px; border-radius: var(--radius);
  background: var(--surface); border: 1.5px solid var(--line); cursor: pointer;
}
.app-opt .app-icon { width: 48px; height: 48px; border-radius: 11px; border: 1px solid var(--line); margin-bottom: 8px; }
.app-opt .who { font-size: 12.5px; color: var(--muted); }
.app-opt .nm { font-size: 16px; font-weight: 600; }
.app-opt input:checked + label { border-color: var(--ink); box-shadow: inset 0 0 0 0.5px var(--ink); }
.app-opt input:checked + label .who { color: var(--accent-ink); font-weight: 600; }
.app-opt input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 키워드 */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; margin: 0; }
.chip label {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 8px 13px; border-radius: 999px; font-size: 14px; font-weight: 500;
  background: var(--surface); border: 1px solid var(--line); cursor: pointer; user-select: none;
}
.chip label::before { content: "#"; color: var(--muted); font-weight: 400; }
.chip input:checked + label { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip input:checked + label::before { color: var(--accent); }
.chip input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
.err { margin: 0; font-size: 13px; color: var(--danger); }

/* 길이 */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
.seg-opt { position: relative; }
.seg-opt input { position: absolute; opacity: 0; inset: 0; margin: 0; }
.seg-opt label { display: flex; flex-direction: column; align-items: center; padding: 8px 4px; border-radius: 9px; cursor: pointer; font-size: 14.5px; font-weight: 600; }
.seg-opt label small { font-size: 11.5px; font-weight: 400; color: var(--muted); }
.seg-opt input:checked + label { background: var(--ink); color: var(--bg); }
.seg-opt input:checked + label small { color: var(--bg); opacity: .7; }
.seg-opt input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 1px; }

/* 버튼 */
.btn {
  appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 0 18px; border-radius: var(--radius); font-size: 16px; text-decoration: none;
}
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-main { background: var(--ink); color: var(--bg); width: 100%; }
.btn-main[disabled] { opacity: .55; cursor: progress; }
.btn-weak { background: var(--accent-weak); color: var(--accent-ink); min-height: 44px; font-size: 14.5px; }
.btn-store { background: var(--accent); color: #0B2A21; width: 100%; }
.btn-ghost { background: transparent; color: var(--muted); min-height: 36px; font-size: 13.5px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }

/* 결과: 앱스토어 리뷰 작성 화면을 닮은 카드 */
.result { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.result-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.stars { color: #F5A524; letter-spacing: 2px; font-size: 15px; }
.field { display: flex; flex-direction: column; padding: 12px 16px; gap: 4px; }
.field + .field { border-top: 1px solid var(--line); }
.field-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.field input, .field textarea {
  width: 100%; border: 0; background: transparent; color: var(--ink); font: inherit; padding: 0; resize: none;
}
.field input { font-size: 16px; font-weight: 600; }
.field textarea { font-size: 15.5px; line-height: 1.7; min-height: 120px; }
.field input:focus, .field textarea:focus { outline: none; }
.result-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 16px 16px; }
.copied { font-size: 13px; color: var(--accent-ink); text-align: center; min-height: 20px; margin: 0; }

.store { display: flex; flex-direction: column; gap: 8px; padding-top: 4px; }
.store-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.store-btns .btn-store { flex-direction: column; gap: 0; min-height: 60px; line-height: 1.3; }
.store-btns .btn-store small { font-size: 12px; font-weight: 500; opacity: .75; }
.store-btns .is-other { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }

.loading { position: relative; }
.dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
@media (prefers-reduced-motion: reduce) { .dots::after { animation: none; content: "..."; } }
</style>

    shortClosers: ["잘 쓰고 있어요.", "추천해요."],
    titles: ["센터 업무가 한결 편해졌어요", "트레이너한테 필요한 기능이 한곳에", "매일 쓰는 업무 앱", "수업 관리가 쉬워졌어요", "트레이너라면 써보세요"]
  },
  member: {

    keywords: [
      { id: "easy", label: "쓰기 쉬움",

      { id: "data", label: "내 데이터 확인",
        lines: ["내 운동 기록이랑 몸 변화를 데이터로 볼 수 있어서 좋아요.", "그동안 쌓인 기록이 한눈에 보여서 얼마나 달라졌는지 알 수 있어요."] },
      { id: "myvideo", label: "내 운동 영상",
        lines: ["수업 때 찍은 내 운동 영상을 앱에서 다시 볼 수 있어서 자세 확인하기 좋아요.", "내 영상을 보면서 집에서도 자세를 따라 해볼 수 있어요."] },
      { id: "journal", label: "수업일지",
        lines: ["수업 끝나면 선생님이 남겨준 수업일지가 와서 오늘 뭘 했는지 다시 볼 수 있어요.", "수업일지를 보면서 집에서도 복습하게 돼요."] },
      { id: "pass", label: "남은 횟수 확인",

      { id: "schedule", label: "수업 일정 확인",
        lines: ["수업 일정이 앱에 다 나와서 언제 수업인지 헷갈리지 않아요.", "다음 수업이 언제인지 바로 볼 수 있어서 편해요."] },
      { id: "motivation", label: "운동 동기부여",

      { id: "talk", label: "선생님과 소통",

    ],

    closers: ["운동 꾸준히 하는 데 도움이 많이 돼요.", "앞으로도 잘 쓸게요.", "PT 다니는 분들께 추천해요."],
    shortClosers: ["잘 쓰고 있어요.", "추천해요."],
    titles: ["운동 다니면서 잘 쓰는 앱", "PT 받는다면 추천해요", "운동 기록이 쌓이는 재미", "내 운동을 한눈에", "운동이 꾸준해졌어요"]

const $ = s => document.querySelector(s);
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

let app = "coach";

function selectedKeywords() {
  return [...document.querySelectorAll("#chips input:checked")].map(i => APPS[app].keywords.find(k => k.id === i.value));
}
function lengthValue() { return document.querySelector("input[name=len]:checked").value; }

function renderChips() {
  $("#chips").innerHTML = "";
  APPS[app].keywords.forEach(k => {
    const d = document.createElement("div"); d.className = "chip";
    const id = `kw-${app}-${k.id}`;
    d.innerHTML = `<input type="checkbox" id="${id}" value="${k.id}"><label for="${id}"></label>`;
    d.querySelector("label").textContent = k.label;
    $("#chips").appendChild(d);
  });
}

function renderStore() {
  const A = APPS[app];
  const ua = navigator.userAgent;
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/.test(ua);
  const ios = $("#store-ios"), android = $("#store-android");
  ios.href = A.ios; android.href = A.android;
  // 지금 쓰는 기기의 스토어를 왼쪽에 민트로, 다른 쪽은 흰 버튼으로
  ios.style.order = isAndroid ? 2 : 1; android.style.order = isAndroid ? 1 : 2;
  ios.classList.toggle("is-other", isAndroid);
  android.classList.toggle("is-other", !isAndroid);
  $("#r-app").textContent = A.name;
}

function setApp(v) {
  app = v;
  $(`#app-${v}`).checked = true;
  renderChips(); renderStore();
  $("#kw-err").hidden = true;
}

// AI가 없을 때 쓰는 조합형 작성기
function composeLocal(kws, len) {
  const A = APPS[app];
  const cap = { short: 2, mid: 3, long: 5 }[len];
  const chosen = shuffle(kws).slice(0, cap);
  const perKw = len === "long" && chosen.length < 3 ? 2 : 1;
  const lines = chosen.flatMap(k => shuffle(k.lines).slice(0, perKw));
  if (len !== "short") {
    lines[0] = pick(["특히 ", ""]) + lines[0];
    if (lines[1]) lines[1] = pick(["그리고 ", "또 ", ""]) + lines[1];
  }
  let body;
  if (len === "short") {
    body = lines.join(" ") + (Math.random() < 0.5 ? " " + pick(A.shortClosers) : "");
  } else if (len === "mid") {
    body = [pick(A.openers), ...lines, pick(A.closers)].join(" ");
  } else {
    body = [pick(A.openers) + " " + pick(A.contexts), lines.join(" "), pick(A.closers)].join("\n\n");
  }
  const unused = A.titles.filter(t => !usedTitles.includes(t));
  return { title: pick(unused.length ? unused : A.titles), body };
}

// 이 화면에서 이미 나온 제목. 다시 생성할 때 같은 제목이 또 나오지 않게 서버에 같이 보낸다.
const usedTitles = [];

// /api/review 가 Claude로 쓴다. 실패하면 null → 조합형으로 대신 쓴다.
async function composeAI(kws, len) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 30000);
  try {
    const res = await fetch("/api/review", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ app, keywords: kws.map(k => k.id), length: len, used: usedTitles.slice(-8) }),
      signal: ctrl.signal
    });
    if (!res.ok) return null;
    const r = await res.json();
    if (typeof r.title !== "string" || typeof r.body !== "string" || !r.body.trim()) return null;
    return r;
  } catch (e) {
    return null;
  } finally {
    clearTimeout(timer);
  }
}

function showResult(r) {
  $("#r-title").value = r.title;
  $("#r-body").value = r.body;
  updateCount();
  $("#result-sec").hidden = false;
  $("#store-no").textContent = "5";
  $("#copied").textContent = "";
  autoSize();
}
function updateCount() { $("#r-count").textContent = `${$("#r-body").value.length}자`; }
function autoSize() { const t = $("#r-body"); t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }

async function generate() {
  const kws = selectedKeywords();
  if (!kws.length) { $("#kw-err").hidden = false; $("#chips").scrollIntoView({ behavior: "smooth", block: "center" }); return; }
  $("#kw-err").hidden = true;
  const btn = $("#gen"), len = lengthValue();
  btn.disabled = true; btn.innerHTML = `리뷰 쓰는 중<span class="dots"></span>`;
  const r = (await composeAI(kws, len)) || composeLocal(kws, len);
  usedTitles.push(r.title);
  showResult(r);
  btn.disabled = false; btn.textContent = "다시 생성하기";
  $("#result-sec").scrollIntoView({ behavior: "smooth", block: "start" });
}

async function copyField(sel, label) {
  const el = $(sel);
  try { await navigator.clipboard.writeText(el.value); $("#copied").textContent = `${label} 복사했어요.`; }
  catch (e) { el.focus(); el.select(); $("#copied").textContent = "길게 눌러 복사해 주세요."; }
}

document.querySelectorAll("input[name=app]").forEach(i => i.addEventListener("change", () => setApp(i.value)));
$("#gen").addEventListener("click", generate);
$("#copy-title").addEventListener("click", () => copyField("#r-title", "제목을"));
$("#copy-body").addEventListener("click", () => copyField("#r-body", "리뷰를"));
$("#r-body").addEventListener("input", () => { updateCount(); autoSize(); });

setApp(location.hash === "#member" ? "member" : "coach");
</script>
